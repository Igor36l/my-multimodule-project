<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Product</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .product-details {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        .product-details h2 {
            margin-top: 0;
        }
        .product-details p {
            margin: 10px 0;
        }
        .form-container {
            margin-top: 20px;
        }
        .form-container form {
            margin-bottom: 20px;
        }
        .form-container label {
            display: block;
            margin-bottom: 5px;
        }
        .form-container input[type="file"] {
            margin-bottom: 10px;
        }
        .form-container button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .form-container button:hover {
            background-color: #0056b3;
        }
        .image-container {
            margin-top: 20px;
        }
        .image-container img {
            max-width: 100px;
            max-height: 100px;
            margin-right: 10px;
        }
    </style>
</head>
<body>
<div class="product-details">
    <h2 th:text="${product.name}">Название товара</h2>
    <p th:text="${product.description}">Описание товара</p>
    <p th:text="${product.price}">Цена товара</p>
</div>

<div class="form-container">
    <form th:action="@{/{productId}/images(productId=${product.id})}" enctype="multipart/form-data" method="post">
        <div>
            <label for="image">Image</label>
            <input id="image" type="file" name="file">
        </div>
        <button type="submit">Загрузить изображение</button>
    </form>

    <form th:action="@{/products/{productId}/delete(productId=${product.id})}" th:method="post">
        <button type="submit">Удалить товар</button>
    </form>
</div>

<div class="image-container">
    <div th:each="image : ${images}">
        <img th:src="@{/{productId}/images(productId=${product.id})}" alt="Product Image">
    </div>
</div>
</body>
</html>
