<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Products</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<h2>Редакктирование пользователя</h2>
<div th:each="error : ${errors}" class="validationError">
    <label th:text="${error.defaultMessage}">error</label>
</div>

<form method="post" th:action="@{/users/{userId}/update(userId=${user.id})}" th:object="${user}">
    <label for="username">Имя пользователя:
        <input type="text" name="username" id="username" placeholder="Name" th:value="*{username}"><br>
    </label>
    <label for="email">Email:
        <input type="text" name="email" id="email" placeholder="email" th:value="*{email}"><br>
    </label>
    <label for="gender">Пол:
        <select id="gender" name="gender">
            <option th:each="gender : ${genders}" th:text="${gender.name}" th:value="${gender.name}">gender</option>
        </select>
    </label><br><br>

    <button type="submit">Обновить</button>
</form>

<form th:action="@{/users/{userId}/sellers(userId=${user.id})}" th:if="${seller.userId() == null}" method="post"
      th:object="${seller}">
    <label for="organizationName">Название организации:
        <input type="text" id="organizationName" name="organizationName" th:value="*{organizationName}">
    </label>
    <label for="organizationDescription">Описание организации:
        <input type="text" id="organizationDescription" name="organizationDescription" value="">
    </label>
    <label for="organizationAddress">Адресс организации:
        <input type="text" id="organizationAddress" name="organizationAddress" value="">
    </label>
    <label for="organizationPhone">Телефон организации:
        <input type="text" id="organizationPhone" name="organizationPhone" value="">
    </label>
    <button type="submit">Создать компанию</button>
</form>

<form th:action="@{/users/{userId}/sellers/update(userId=${user.id})}" th:if="${seller.userId() != null}" method="post"
      th:object="${seller}">
    <label for="organizationName2">Название организации:
        <input type="text" id="organizationName2" name="organizationName" th:value="*{organizationName}">
    </label>
    <label for="organizationDescription2">Описание организации:
        <input type="text" id="organizationDescription2" name="organizationDescription" value="">
    </label>
    <label for="organizationAddress2">Адресс организации:
        <input type="text" id="organizationAddress2" name="organizationAddress" value="">
    </label>
    <label for="organizationPhone2">Телефон организации:
        <input type="text" id="organizationPhone2" name="organizationPhone" value="">
    </label>
    <button type="submit">Обновить компанию</button>
</form>
</body>
</html>
