<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Products</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<h2>Редакктирование пользователя</h2>
<div th:each="error : ${errors}" class="validationError">
    <label th:text="${error.defaultMessage}">error</label>
</div>

<form method="post" th:action="@{/users/{userId}/update(userId=${user.id})}" th:object="${user}">
    <label for="username">Имя пользователя:
        <input type="text" name="username" id="username" placeholder="Name" th:value="*{username}"><br>
    </label>
    <label for="email">Email:
        <input type="text" name="email" id="email" placeholder="email" th:value="*{email}"><br>
    </label>
    <label for="gender">Пол:
    <select id="gender" name="gender">
        <option th:each="gender : ${genders}" th:text="${gender.name}" th:value="${gender.name}">gender</option>
    </select>
    </label><br><br>

    <button type="submit">Обновить</button>
</form>
</body>
</html>
